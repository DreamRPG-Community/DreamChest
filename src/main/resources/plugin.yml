name: DreamChest
version: ${version}
main: cn.mythicland.dreamchest.DreamChestPlugin
author: ShanguanLinG
load: POSTWORLD
depend:
- DreamLib
- DecentHolograms
- MythicMobs
softdepend:
- DreamWorld
description: Virtual administrator-managed chests with scheduled refreshes.
commands:
  dreamchest:
    description: Manage DreamChest configuration.
    aliases:
    - dchest
permissions:
  dreamchest.admin:
    description: Allows DreamChest administration and chest editing.
    default: op
  dreamchest.reload:
    description: Allows reloading DreamChest configuration.
    default: op
